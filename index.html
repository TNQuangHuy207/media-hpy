<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #020208;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            user-select: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
            max-width: 650px;
            width: 100%;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            background: linear-gradient(45deg, #ff007f, #ff758c, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
            margin-bottom: 10px;
            font-weight: 800;
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        p {
            font-size: clamp(1rem, 2.8vw, 1.4rem);
            color: #e0f7fa;
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.8);
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.8)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 35px rgba(0, 255, 255, 0.9)); transform: scale(1.02); }
        }

        .cake-container {
            position: relative;
            width: 220px;
            height: 200px;
            margin: 0 auto 25px auto;
            transform: scale(clamp(0.85, 1.2vw + 0.5rem, 1.15));
        }

        .plate-3d {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 20px;
            background: linear-gradient(135deg, #e6e6e6, #ffffff, #b0b0b0);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 2px 5px #fff;
        }

        .cake-tier {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 12px 12px 18px 18px;
            box-shadow: inset 0 -8px 12px rgba(0,0,0,0.3), inset 0 5px 8px rgba(255,255,255,0.6), 0 8px 15px rgba(0,0,0,0.4);
        }

        .tier-bottom {
            bottom: 15px;
            width: 180px;
            height: 55px;
            background: linear-gradient(to right, #e91e63, #ff6090, #e91e63);
        }

        .tier-middle {
            bottom: 65px;
            width: 135px;
            height: 48px;
            background: linear-gradient(to right, #ff9800, #ffc107, #ff9800);
        }

        .tier-top {
            bottom: 108px;
            width: 90px;
            height: 42px;
            background: linear-gradient(to right, #00bcd4, #80deea, #00bcd4);
        }

        .icing {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 15px;
            background: #ffffff;
            border-radius: 10px 10px 8px 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .icing::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10%;
            width: 80%;
            height: 8px;
            background: #ffffff;
            border-radius: 0 0 10px 10px;
        }

        .strawberry {
            position: absolute;
            top: -12px;
            width: 14px;
            height: 16px;
            background: #d50000;
            border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
        }

        .strawberry.left { left: 15px; }
        .strawberry.right { right: 15px; }

        .candle-group {
            position: absolute;
            bottom: 145px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }

        .candle-3d {
            position: relative;
            width: 8px;
            height: 32px;
            background: repeating-linear-gradient(45deg, #fff, #fff 4px, #ff4081 4px, #ff4081 8px);
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .wick {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 6px;
            background: #222;
        }

        .flame-3d {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 20px;
            background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffeb3b 35%, #ff5722 85%);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            box-shadow: 0 0 15px #ffeb3b, 0 0 30px #ff5722;
            animation: flicker3D 0.15s infinite alternate ease-in-out;
            transform-origin: center bottom;
        }

        @keyframes flicker3D {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.95; }
            100% { transform: translateX(-50%) scale(1.15) rotate(2deg); opacity: 1; filter: brightness(1.2); }
        }

        .instruction {
            font-size: clamp(0.8rem, 2.2vw, 1rem);
            color: #b0bec5;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <h1>CHÚC MỪNG SINH NHẬT!</h1>
        <p>Chúc bạn tuổi mới rực rỡ, may mắn và tràn ngập hạnh phúc!</p>

        <div class="cake-container">
            <div class="plate-3d"></div>
            
            <div class="cake-tier tier-bottom">
                <div class="icing"></div>
            </div>
            <div class="cake-tier tier-middle">
                <div class="icing"></div>
                <div class="strawberry left"></div>
                <div class="strawberry right"></div>
            </div>
            <div class="cake-tier tier-top">
                <div class="icing"></div>
            </div>
            <div class="candle-group">
                <div class="candle-3d">
                    <div class="wick"></div>
                    <div class="flame-3d"></div>
                </div>
                <div class="candle-3d" style="height: 38px; top: -6px;">
                    <div class="wick"></div>
                    <div class="flame-3d"></div>
                </div>
                <div class="candle-3d">
                    <div class="wick"></div>
                    <div class="flame-3d"></div>
                </div>
            </div>
        </div>

        <div class="instruction">Nhấp hoặc chạm liên tục vào màn hình để tạo pháo hoa theo ý thích!</div>
    </div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y, vx, vy, vz, color, isSparkle = false) {
                this.x = x;
                this.y = y;
                this.z = vz;
                this.vx = vx;
                this.vy = vy;
                this.vz = vz;
                this.color = color;
                this.friction = 0.95;
                this.gravity = 0.12;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                this.isSparkle = isSparkle;
                this.size = Math.random() * 2.5 + 1.5;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vz *= this.friction;

                this.x += this.vx;
                this.y += this.vy + this.gravity;
                this.z += this.vz;

                this.alpha -= this.decay;
            }

            draw() {
                let scale = 1 + this.z * 0.015;
                scale = Math.max(0.3, scale);

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                if (this.isSparkle && Math.random() > 0.3) {
                    ctx.globalAlpha *= 0.4;
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * scale, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.restore();
            }
        }

        class Firework {
            constructor(startX, startY, endX, endY, shapeType) {
                this.x = startX;
                this.y = startY;
                this.endX = endX;
                this.endY = endY;
                this.distanceCovered = 0;
                this.distanceTotal = Math.hypot(endX - startX, endY - startY);
                this.speed = 16;
                this.angle = Math.atan2(endY - startY, endX - startX);
                this.particles = [];
                this.exploded = false;
                this.shapeType = shapeType || this.getRandomShape();
                this.hue = Math.random() * 360;
                this.color = `hsl(${this.hue}, 100%, 65%)`;
            }

            getRandomShape() {
                const shapes = ['sphere', 'star', 'heart', 'flower', 'ring'];
                return shapes[Math.floor(Math.random() * shapes.length)];
            }

            explode() {
                this.exploded = true;
                const particleCount = window.innerWidth < 768 ? 90 : 160;

                for (let i = 0; i < particleCount; i++) {
                    let vx, vy, vz = 0;
                    let baseSpeed = Math.random() * 3 + 4;
                    let pColor = `hsl(${this.hue + (Math.random() * 40 - 20)}, 100%, ${Math.random() * 30 + 60}%)`;

                    if (Math.random() < 0.25) {
                        pColor = `hsl(${Math.random() * 360}, 100%, 75%)`;
                    }

                    if (this.shapeType === 'heart') {
                        let t = (i / particleCount) * Math.PI * 2;
                        let hx = 16 * Math.pow(Math.sin(t), 3);
                        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        let factor = (Math.random() * 0.25 + 0.75) * 0.35;
                        vx = hx * factor;
                        vy = hy * factor;
                        vz = (Math.random() - 0.5) * 2;
                    } else if (this.shapeType === 'star') {
                        let angle = (i / particleCount) * Math.PI * 2;
                        let numPoints = 5;
                        let r = Math.sin(numPoints * angle / 2);
                        r = Math.abs(r) * 0.6 + 0.4;
                        let factor = (Math.random() * 0.2 + 0.8) * baseSpeed;
                        vx = Math.cos(angle) * r * factor;
                        vy = Math.sin(angle) * r * factor;
                        vz = (Math.random() - 0.5) * 3;
                    } else if (this.shapeType === 'flower') {
                        let angle = (i / particleCount) * Math.PI * 2;
                        let petals = 6;
                        let r = 1 + 0.5 * Math.sin(petals * angle);
                        let factor = (Math.random() * 0.2 + 0.8) * baseSpeed * 0.85;
                        vx = Math.cos(angle) * r * factor;
                        vy = Math.sin(angle) * r * factor;
                        vz = (Math.random() - 0.5) * 4;
                    } else if (this.shapeType === 'ring') {
                        let angle = (i / particleCount) * Math.PI * 2;
                        let factor = (Math.random() * 0.1 + 0.9) * baseSpeed * 1.2;
                        vx = Math.cos(angle) * factor;
                        vy = Math.sin(angle) * factor;
                        vz = (Math.random() - 0.5) * 1.5;
                    } else { 
                        let theta = Math.random() * Math.PI * 2;
                        let phi = (Math.random() - 0.5) * Math.PI;
                        let spd = (Math.random() * 0.4 + 0.6) * baseSpeed * 1.3;
                        vx = Math.cos(phi) * Math.cos(theta) * spd;
                        vy = Math.sin(phi) * spd;
                        vz = Math.cos(phi) * Math.sin(theta) * spd;
                    }

                    let isSparkle = Math.random() > 0.5;
                    this.particles.push(new Particle(this.endX, this.endY, vx, vy, vz, pColor, isSparkle));
                }
            }

            update() {
                if (!this.exploded) {
                    let vx = Math.cos(this.angle) * this.speed;
                    let vy = Math.sin(this.angle) * this.speed;
                    this.x += vx;
                    this.y += vy;
                    this.distanceCovered += Math.hypot(vx, vy);

                    if (this.distanceCovered >= this.distanceTotal) {
                        this.explode();
                    }
                } else {
                    this.particles.forEach((p, index) => {
                        p.update();
                        if (p.alpha <= 0) {
                            this.particles.splice(index, 1);
                        }
                    });
                }
            }

            draw() {
                if (!this.exploded) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.restore();
                } else {
                    this.particles.forEach(p => p.draw());
                }
            }
        }

        let fireworks = [];

        function launchAutoFirework() {
            let startX = Math.random() * width;
            let startY = height;
            let endX = Math.random() * (width * 0.8) + width * 0.1;
            let endY = Math.random() * (height * 0.45) + height * 0.08;
            fireworks.push(new Firework(startX, startY, endX, endY));
        }

        function autoLoop() {
            launchAutoFirework();
            if (Math.random() < 0.4) { 
                setTimeout(launchAutoFirework, 100);
            }
            let nextInterval = Math.random() * 250 + 200;
            setTimeout(autoLoop, nextInterval);
        }

        window.addEventListener('pointerdown', (e) => {
            let startX = width / 2;
            let startY = height;
            fireworks.push(new Firework(startX, startY, e.clientX, e.clientY));
        });

        function animate() {
            ctx.fillStyle = 'rgba(2, 2, 8, 0.18)';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'lighter';

            fireworks.forEach((fw, index) => {
                fw.update();
                fw.draw();
                if (fw.exploded && fw.particles.length === 0) {
                    fireworks.splice(index, 1);
                }
            });

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        autoLoop();
        animate();
    </script>
</body>
</html>
